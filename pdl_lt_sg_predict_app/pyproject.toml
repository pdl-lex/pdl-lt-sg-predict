[project]
name = "pdl-lt-sg-predict-app"
version = "0.1.0"
description = "Sachgruppen-Klassifikation Web-App"
requires-python = ">=3.10"

dependencies = [
    "reflex>=0.8.26",
    "pandas>=2.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "lxml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
