[project]
name = "lt-sg-predict"
version = "0.1.0"
description = "LexoTerm Tools — ML-Vorhersage von Sachgruppen aus Wörterbuchdaten (FastAPI + React/Vite)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Backend (FastAPI)
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.49.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.2.2",
    # ML-Pipeline (unverändert aus dem CLI/Classifier)
    # Obergrenze <2.5: numba (transitiv über shap) unterstützt numpy erst bis
    # 2.4.x. Ohne Cap zieht der Resolver numpy 2.5.x und fällt bei numba auf das
    # uralte, nicht baubare 0.53.1 zurück (Build-Fehler auf py>=3.10).
    "numpy>=2.4.2,<2.5",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.1.3",
    "shap>=0.46.0",
    "tqdm>=4.67.3",
    "spacy>=3.7",
    "de-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28.1", # für starlette TestClient in tests/
    "lxml>=6.1.1",
    # Nur von den Analyse-Skripten (scripts/) genutzt, nicht vom Backend/ML-Kern.
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sachgruppen_classifier", "shap_utils"]

# find statt statischer Liste: nimmt auch die Subpackages (api, api.routers,
# core) mit — eine statische ["pdl_lt_sg_predict"] wuerde sie beim
# Nicht-Editable-Install (Docker) auslassen.
[tool.setuptools.packages.find]
include = ["pdl_lt_sg_predict*"]
